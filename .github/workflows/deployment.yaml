name: Deployment Pipeline

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # -------------------------
      # SonarQube Code Scan
      # -------------------------
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -------------------------
      # Login to Docker Hub
      # -------------------------
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Build Docker image
        run: |
          TAG=${GITHUB_RUN_NUMBER}
          docker build -t ${{ secrets.DOCKERHUB_REPO }}:$TAG .

      # -------------------------
      # Trivy Vulnerability Scan
      # -------------------------
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_REPO }}:${{ github.run_number }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true

      # -------------------------
      # Push Image After Scan Passes
      # -------------------------
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_REPO }}:${{ github.run_number }}

      # -------------------------
      # Deploy to EC2
      # -------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop app || true
            docker rm app || true
            docker pull ${{ secrets.DOCKERHUB_REPO }}:${{ github.run_number }}
            docker run -d --name app -p 80:80 ${{ secrets.DOCKERHUB_REPO }}:${{ github.run_number }}
